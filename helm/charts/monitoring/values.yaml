global:
  environment: ""

gateway:
  tls:
    enabled: true
    selfSigned: true
  hosts:
    domain: ""

adminUser: admin
adminPassword: admin

"grafana.ini":
  server:
    root_url: "%(protocol)s://%(domain)s/grafana"
    serve_from_sub_path: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://monitoring-database-server.monitoring.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    agent:
      json: |
        {
          "title": "Agent",
          "uid": "agent",
          "schemaVersion": 38,
          "panels": [
            {
              "id": 1,
              "title": "Total Tool Calls",
              "type": "stat",
              "gridPos": { "x": 0, "y": 0, "w": 8, "h": 4 },
              "targets": [{
                "datasource": "Prometheus",
                "expr": "sum by (tool) (tool_calls_total)",
                "legendFormat": "{{tool}}"
              }],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
            },
            {
              "id": 2,
              "title": "Avg Duration (s)",
              "type": "stat",
              "gridPos": { "x": 8, "y": 0, "w": 8, "h": 4 },
              "targets": [{
                "datasource": "Prometheus",
                "expr": "tool_call_duration_seconds_sum / tool_call_duration_seconds_count",
                "legendFormat": "{{tool}}"
              }],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
            },
            {
              "id": 3,
              "title": "Error Calls",
              "type": "stat",
              "gridPos": { "x": 16, "y": 0, "w": 8, "h": 4 },
              "targets": [{
                "datasource": "Prometheus",
                "expr": "sum by (tool) (tool_calls_total{status=\"error\"})",
                "legendFormat": "{{tool}}"
              }],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": { "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } } }
            }
          ]
        }

ingress:
  enabled: false
